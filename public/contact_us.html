<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LYMNOUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-tokens.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body style="background-color: #dcfce7;">
    <div id="app" style="background-color: #dcfce7;">
        <!-- Upper Navigation Bar -->
        <header class="navbar" style="background: #ffffff; border-bottom: 2px solid #000000; box-shadow: 2px 2px 0px #000000;">
            <div class="navbar-container">
                <a href="index.html" class="navbar-brand" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
                    <img src="images/lymnous_logo.png" alt="LYMNOUS Logo" style="height: 42px; width: 42px; border-radius: 8px; object-fit: cover; border: 1.5px solid #000000; box-shadow: 1px 1px 0px #000000;">
                    <span class="navbar-title" style="font-weight: 900; color: #000000; font-size: 1.5rem; letter-spacing: -0.5px;">LYMNOUS</span>
                </a>
                <nav class="navbar-menu">
                    <a href="index.html#about-us" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">About &amp; Story</a>
                    <a href="index.html#features" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">How It Works</a>
                    <a href="pricing.html" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">Plans &amp; Pricing</a>
                    <a href="index.html#qa" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">Help &amp; FAQ</a>
                    <a href="index.html#our-mission" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">Our Mission</a>
                    <a href="contact_us.html" class="navbar-link" style="font-weight: 800; font-size: 1.05rem; color: #000000;">Contact Us</a>
                </nav>
            </div>
        </header>

        <main id="main-content" style="background-color: #dcfce7; min-height: calc(100vh - 65px);">
            <div class="landing-section" style="background-color: #dcfce7;">
                <div class="landing-container">
                    <div class="section-header">
                        <h1 class="section-title">Contact Us</h1>
                        <div class="section-divider"></div>
                        <p class="section-subtitle">Have questions? Get in touch with the support team.</p>
                    </div>

                    <form id="contact-us-form" class="contact-form" action="#">
                        <div style="display: flex; gap: 1.5rem; flex-wrap: wrap;">
                            <div class="form-group" style="flex: 1; min-width: 200px;">
                                <label class="form-label">First Name</label>
                                <input type="text" id="first-name" class="form-control" required>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 200px;">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="last-name" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone (Optional)</label>
                            <input type="tel" id="phone" class="form-control">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Message</label>
                            <textarea id="message" class="form-control" rows="5" required style="resize: vertical;"></textarea>
                        </div>

                        <div style="text-align: center; margin-top: 2rem;">
                            <button type="submit" class="btn btn-primary" style="padding: 1rem 3rem;">Send Message</button>
                            <p id="form-feedback" style="margin-top: 1rem; display: none; padding: 1rem; border-radius: 8px;"></p>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/contact.js"></script>
</body>
</html>
